<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь</title>
    <link rel="stylesheet" href="css/style.css">   
</head>
<body>
    <div id="wrapper">
        <header>
            <a href="index.html" id="logo">
                <span class="pink">Сайтик</span> <i>визит04ка</i>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">ГЛАВНАЯ ФАНАТКА</a></li>
                    <li><a href="uslugi.html">фанатки</a></li>
                    <li><a href="price.html">цены</a></li>
                    <li><a href="sound.html">музончик</a></li>
                    <li><a href="contact.html">номера</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <h2>Обратная связь</h2>
            <form id="contact-form" action="#" method="post">
                <div class="form__item">
                    <label for="topic">Тема обращения:</label><br>
                    <select id="topic" name="topic" required>
                        <option value="">Выберите тему</option>
                        <option value="question">Вопрос</option>
                        <option value="complaint">Жалоба</option>
                        <option value="suggestion">Предложение</option>
                    </select>
                </div>
                <div class="form__item">
                    <label for="name">Ваше имя:</label><br>
                    <input type="text" id="name" name="name" placeholder="Введите ваше имя" required>
                </div>
                <div class="form__item">
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" placeholder="your@mail.com" required>
                </div>
                <div class="form__item">
                    <label for="phone">Телефон:</label><br>
                    <input type="tel" id="phone" name="phone" placeholder="+7 123 456-78-90">
                </div>
                <div class="form__item">
                    <label for="date">Удобная дата:</label><br>
                    <input type="date" id="date" name="date">
                </div>
                <div class="form__item">
                    <label for="message">Текст сообщения:</label><br>
                    <textarea id="message" name="message" rows="5" placeholder="Введите ваше сообщение" required></textarea>
                </div>
                <div class="form__item">
                    <input type="submit" value="Отправить">
                </div>
            </form>
        </main>
    </div>

    <footer>
        <a href="form.html" class="footer_block">Написать нам &#9650</a>
        <p class="footer_block">&copy; Новая компания</p>
        <div class="footer_icons">
            <a href="https://vk.com/dekofanpage" target="_blank">
            <img src="img/ghoul.jpg" alt="VK" class="footer_img">
            </a>
        </div>
    </footer>
</body>
</html>
